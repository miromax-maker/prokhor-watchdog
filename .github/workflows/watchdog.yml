name: prokhor-watchdog
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # закреплено по отпечатку коммита: подмена метки v4 (как tj-actions 03.2025) не подсунет чужой код
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node --version  # Node есть в образе ubuntu-latest; setup-node убран — меньше чужого кода рядом с ключом VK
      - name: check bot
        run: node check.mjs
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          VK_TOKEN: ${{ secrets.VK_ALERT_TOKEN }}
          VK_PEER: ${{ secrets.VK_PEER }}
      - name: save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "prokhor-watchdog"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state"
            git push
          fi
