name: prokhor-watchdog
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: check bot
        run: node check.mjs
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          VK_TOKEN: ${{ secrets.VK_ALERT_TOKEN }}
          VK_PEER: ${{ secrets.VK_PEER }}
      - name: save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "prokhor-watchdog"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state"
            git push
          fi
